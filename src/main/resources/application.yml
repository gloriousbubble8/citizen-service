spring:
  profiles:
    active: dev
  application:
    name: citizen-service

  datasource:
    url: jdbc:postgresql://localhost:5433/citizen_registry
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false # recommended: false for production
