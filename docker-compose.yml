# Single-node Kafka (KRaft mode, no ZooKeeper) + Kafbat UI
# Light enough for an 8 GB laptop.
#
# Spring Boot app (running on your laptop) connects with:
#   spring.kafka.bootstrap-servers=localhost:9092
# Kafka UI: http://localhost:8090

services:
  kafka:
    image: apache/kafka:4.0.0          # which image to run
    container_name: kafka              # fixed name so other containers can find it
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"                    # laptop port : container port
    environment:
      # Keep memory small: 512 MB heap for the broker
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

      # This one node acts as both broker and controller (KRaft)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Two doors into Kafka:
      #   PLAINTEXT (kafka:19092)    -> for containers inside Docker (the UI)
      #   EXTERNAL  (localhost:9092) -> for your Spring Boot app on the laptop
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Only one broker, so everything must use replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data # keeps messages after restart

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka                          # start Kafka first
    ports:
      - "8090:8080"                    # 8090 on laptop so it won't clash with Spring Boot on 8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092   # "kafka" = the service name above
      JAVA_OPTS: "-Xms128m -Xmx384m"                   # cap the UI's memory too

volumes:
  kafka-data: